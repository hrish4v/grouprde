name: Build GroupRide APK

# Builds an installable Android APK on GitHub's servers (full internet access),
# then uploads it as a downloadable artifact. Runs on every push and can be
# triggered manually from the Actions tab.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        run: bash tool/prepare_android.sh
        env:
          # Optional: add a repo secret named MAPS_API_KEY to bake in your
          # Google Maps key so tiles load. Leave unset to ship with placeholder.
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: grouprde-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
