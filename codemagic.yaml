workflows:
  groupride-android:
    name: GroupRide Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Scaffold Android project + apply manifest
        script: bash tool/prepare_android.sh
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - hrishav.raj@eloelo.in
        notify:
          success: true
          failure: true
